name: ✨ Feature Request
description: Suggest an idea or new template capability for create-express-modular-go
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new generator, ORM option, middleware, or CLI improvement? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or DX limitation.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Scaffolding Output
      description: Describe how the feature should behave, CLI flags, or files generated.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false
