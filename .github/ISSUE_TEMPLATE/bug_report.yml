name: 🐛 Bug Report
description: Create a report to help us improve create-express-modular-go
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues before submitting.
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What command did you run?
      placeholder: |
        1. Run 'cem my-app -y'
        2. Inspect output
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System & Architecture
      placeholder: "Linux x86_64 / macOS Sonoma Apple Silicon / Windows 11"
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go Version
      placeholder: "go version go1.22.0 linux/amd64"
    validations:
      required: false
  - type: input
    id: cli-version
    attributes:
      label: CLI Version
      placeholder: "cem --version"
    validations:
      required: false
